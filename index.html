<html lang="en">

<title>Sam App</title>

<meta name="theme-color" content="#1F4D43">

<style>

*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}
.hello h1{font-size:26px;line-height:1.15;letter-spacing:-.01em}
.hello p{color:var(--mute);margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;min-height:40px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--brand);flex:none;font-size:18px}
.ch h2{font-size:18px;line-height:1.2}
.ch .sub{font-size:13px;color:var(--mute)}
.grow{flex:1;min-width:0}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#0E1A16}}
.hero .l{font-size:13px;opacity:.85}
.hero .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .s{font-size:13px;opacity:.85;text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{background:var(--soft);border-radius:14px;padding:12px}
.tile .l{font-size:12.5px;color:var(--mute)}
.tile .v{font-size:19px;font-weight:700;margin-top:2px}
.flag{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14.5px;font-weight:600}

.flag.warn{background:var(--warnbg);color:var(--warn)}
.flag .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:34px;background:var(--brand2);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.today i{background:var(--amber)}
.bar span{font-size:11px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:16px;text-decoration:none;margin-top:14px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0E1A16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1A16}}
.btn.ghost{background:transparent;color:var(--brand)!important;border:1.5px solid var(--line)}
.soon{display:flex;align-items:center;gap:12px;opacity:.75}
.soon .logo{background:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:14px;font-weight:600}
.field input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:50px}
.field input:focus{outline:none;border-color:var(--brand)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.lockic{width:72px;height:72px;border-radius:22px;background:var(--brand);margin:0 auto 18px;display:grid;place-items:center}
.lockic svg{width:34px;height:34px;stroke:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tog{width:52px;height:32px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--brand)}
.tog.on::after{left:23px}
.foot{text-align:center;font-size:12.5px;color:var(--mute);margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>

  const now=new Date(),from=dkey(new Date(now.getFullYear(),now.getMonth(),1)),to=dkey();
  const o={sales:0,cogs:0,exp:0,cust:0,closed:0,days:0};
  for(let d=new Date(now.getFullYear(),now.getMonth(),1);dkey(d)<=to;d.setDate(d.getDate()+1)){const c=dayCalc(dkey(d));o.sales+=c.sales;o.cogs+=c.cogs;o.cust+=c.cust||0;if(c.close)o.closed++;o.days++}
  o.exp=Object.values(S.exp).filter(x=>x.d>=from&&x.d<=to).reduce((a,x)=>a+num(x.a),0);
  o.net=o.sales-o.cogs-o.exp;return o;
}

  h+='<div class="grid"><div class="tile"><div class="l">'+t('sales')+'</div><div class="v num">'+fmt(d.sales)+'</div></div>'

    +(ls.get('sam_hr')?'<button class="btn ghost" data-act="hrOut">'+t('hrOut')+'</button>':'')+(P.state==='in'?'<button class="btn ghost" data-act="ptOut">'+t('ptOut')+'</button>':'')+'<button class="btn ghost" data-act="signout">'+t('signout')+'</button></div>';

function ptRate(c){const r=P.set&&P.set.rates;return c==='LAK'?1:(r&&r[c]>0?r[c]:PT_RATES[c]||1)}
const ptLAK=e=>num(e.amount)*ptRate(e.currency);
const ptFmt=(v,c)=>(PT_SYM[c]||'')+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:c==='LAK'?0:2});
function vHR(){
  let h='<div class="card"><div class="ch"><div class="logo" style="background:#8A5A12">HR</div><div class="grow"><h2>'+t('fp')+'</h2><div class="sub">'+t('fpSub')+'</div></div>'+(H.state==='in'?'<button class="chip" data-act="hrLoad">'+t('hrRef')+'</button>':'')+'</div>';
  if(H.state==='loading'&&!H.data)return h+'<p class="mute">'+t('loading')+'</p></div>';
  if(H.state==='out'||!H.data){
    return h+'<p class="mute" style="font-size:14px">'+t('hrConnect')+'</p><form id="hrf"><div class="field"><label for="hp">'+t('hrPin')+'</label><input id="hp" type="password" inputmode="numeric" autocomplete="off"></div><div class="err">'+esc(H.err)+'</div>'
      +'<button class="btn" type="submit" style="background:#8A5A12;color:#fff">'+t('hrIn')+'</button></form></div>';
  }
  const d=H.data,rows=d.rows||[],ids=ty=>new Set(rows.filter(r=>r.type===ty).map(r=>r.id)),inI=ids('IN'),outI=ids('OUT');
  const pend=(d.requests||[]).filter(r=>r.status==='PENDING').length,flag=rows.filter(r=>r.status==='FLAG').length;
  const miss=(d.staff||[]).filter(x=>!inI.has(x.id)&&!outI.has(x.id));
  h+='<div class="grid"><div class="tile"><div class="l">'+t('hrInN')+'</div><div class="v num">'+inI.size+'</div></div><div class="tile"><div class="l">'+t('hrOutN')+'</div><div class="v num">'+outI.size+'</div></div></div>';
  if(pend)h+='<div class="flag warn"><span class="dot"></span>'+t('hrWait')+': '+pend+'</div>';
  if(flag)h+='<div class="flag warn"><span class="dot"></span>'+t('hrFlag')+': '+flag+'</div>';
  h+=miss.length?'<div class="sec">'+t('hrMiss',{n:miss.length})+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+miss.slice(0,12).map(x=>'<span class="chip" style="min-height:0;padding:5px 10px;font-weight:500">'+esc(x.name)+'</span>').join('')+(miss.length>12?'<span class="mute" style="padding:5px">+'+(miss.length-12)+'</span>':'')+'</div>'
    :'<div class="flag ok"><span class="dot"></span>'+t('hrAll')+'</div>';
  const last=rows.slice(-4).reverse();
  h+='<div class="sec">'+t('hrLast')+'</div>'+(last.length?'<div class="rows">'+last.map(r=>'<div class="r"><span>'+esc(String(r.time||'').slice(0,5))+' · '+esc(r.name)+'</span><b>'+t('w'+r.type)+'</b></div>').join('')+'</div>':'<p class="mute">'+t('hrNone')+'</p>');
  return h+'<a class="btn" style="background:#8A5A12;color:#fff" href="'+HR_URL+'">'+t('openHR')+' →</a></div>';
}
async function hrLoad(pin){
  pin=pin||ls.get('sam_hr');if(!pin){H.state='out';render();return}
  H.state='loading';if(!H.data)render();
  try{const r=await fetch(HR_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'day',admin:pin,date:dkey()})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'x');
    H.data=j;H.state='in';H.err='';ls.set('sam_hr',pin);H.at=Date.now();
  }catch(e){if(!H.data){H.state='out';H.err=t('hrErr')}else H.state='in'}
  render();
}
function vPT(){
  let h='<div class="card"><div class="ch"><div class="logo" style="background:#5B3FA8">PT</div><div class="grow"><h2>'+t('pt')+'</h2><div class="sub">'+t('ptSub')+'</div></div></div>';
  if(P.state==='loading'){return h+'<p class="mute">'+t('loading')+'</p></div>'}
  if(P.state==='out'){
    return h+'<p class="mute" style="font-size:14px">'+t('ptConnect')+'</p><form id="ptf"><div class="field"><label for="pe">'+t('ptEmail')+'</label><input id="pe" type="email" autocomplete="username" autocapitalize="none"></div>'
      +'<div class="field"><label for="pp">'+t('pass')+'</label><input id="pp" type="password" autocomplete="current-password"></div><div class="err">'+esc(P.err)+'</div>'
      +'<button class="btn" type="submit">'+t('ptIn')+'</button></form><button class="btn ghost" data-act="ptGoogle">'+t('ptGoogle')+'</button></div>';
  }
  const k=dkey(),mk=k.slice(0,7),me=P.entries.filter(e=>e.date&&e.date.slice(0,7)===mk);
  const month=me.reduce((a,e)=>a+ptLAK(e),0),today=me.filter(e=>e.date===k).reduce((a,e)=>a+ptLAK(e),0);
  h+='<div class="hero" style="background:#5B3FA8"><div><div class="l">'+t('ptMonth')+'</div><div class="v num">'+fmt(month)+'</div></div><div class="s">'+t('kip')+'</div></div>';
  const bud=P.set&&num(P.set.budget);
  h+='<div class="grid"><div class="tile"><div class="l">'+t('ptToday')+'</div><div class="v num">'+fmt(today)+'</div></div>';
  if(bud>0){const left=bud-month;h+='<div class="tile"><div class="l">'+t('ptBudget')+' '+fmt(bud)+'</div><div class="v num" style="color:'+(left<0?'var(--bad)':'var(--good)')+'">'+fmt(Math.abs(left))+' <span style="font-size:13px;font-weight:600">'+t(left<0?'ptOver':'ptLeft')+'</span></div></div>'}
  else h+='<div class="tile"><div class="l">'+t('ptLast')+'</div><div class="v num">'+me.length+'</div></div>';
  h+='</div>';
  if(!me.length)return h+'<p class="mute" style="margin-top:12px">'+t('ptNone')+'</p><a class="btn" href="'+PT_URL+'">'+t('openPT')+' →</a></div>';
  const by={};me.forEach(e=>{by[e.cat||'—']=(by[e.cat||'—']||0)+ptLAK(e)});
  const top=Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,4);
  h+='<div class="sec">'+t('ptTop')+' · '+t('inKip')+'</div><div class="rows">'+top.map(c=>'<div class="r"><span>'+esc(c)+'</span><b class="num">'+fmt(by[c])+'</b></div>').join('')+'</div>';
  const last=me.slice().sort((a,b)=>(b.date+String(b.ts||0))>(a.date+String(a.ts||0))?1:-1).slice(0,3);
  h+='<div class="sec">'+t('ptLast')+'</div><div class="rows">'+last.map(e=>'<div class="r"><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.cat||'')+(e.note?' · <span class="mute">'+esc(e.note)+'</span>':'')+'<br><span class="mute" style="font-size:12.5px">'+esc(e.date)+'</span></span><b class="num">'+ptFmt(num(e.amount),e.currency)+'</b></div>').join('')+'</div>';
  return h+'<a class="btn" style="background:#5B3FA8;color:#fff" href="'+PT_URL+'">'+t('openPT')+' →</a></div>';
}
function render(){
  const a=$('#app');document.documentElement.lang=S.lang==='lo'?'lo':'en';
  if(S.mode==='loading'){a.innerHTML='<div class="center" style="text-align:center"><p class="mute">'+t('loading')+'</p></div>';return}
  if(S.mode==='login'){const u=$('#lu')?$('#lu').value:'';a.innerHTML=vLogin();if(u)$('#lu').value=u;return}
  if(S.mode==='notOwner'){a.innerHTML='<div class="center" style="text-align:center"><p>'+t('notOwner')+'</p><button class="btn" data-act="signout">'+t('signout')+'</button></div>';return}
  if(S.locked){a.innerHTML=vLock();return}
  const y=window.scrollY,keep={},fid=document.activeElement&&document.activeElement.id;['pe','pp','hp'].forEach(i=>{const el=$('#'+i);if(el)keep[i]=el.value});
  a.innerHTML=vHome();Object.keys(keep).forEach(i=>{const el=$('#'+i);if(el)el.value=keep[i]});if(fid&&$('#'+fid))$('#'+fid).focus();window.scrollTo(0,y);
}

// ---- Face ID / fingerprint lock (WebAuthn, stays on this phone) ----
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function bioOk(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function lockOn(){
  if(!await bioOk()){toast(t('noBio'));return}
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Sam App'},user:{id:rnd(16),name:S.user||'owner',displayName:'Samboun'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
    ls.set('sam_lock',b64(c.rawId));toast(t('lockSet'));render();
  }catch(e){}
}
async function unlock(){
  const id=ls.get('sam_lock');if(!id){S.locked=false;render();return}
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});S.locked=false;render()}catch(e){}
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now()}
  else if(S.mode==='home'&&ls.get('sam_hr')&&(!H.at||Date.now()-H.at>120000))hrLoad();
  if(document.hidden){}
  else if(ls.get('sam_lock')&&hiddenAt&&Date.now()-hiddenAt>LOCK_AFTER&&S.mode==='home'){S.locked=true;render();unlock()}
});

// ---- data ----
let unsubs=[];
const auth=(()=>{try{firebase.initializeApp(FB_CONFIG);const db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}return {a:firebase.auth(),db:db}}catch(e){return null}})();
let ptUnsub=null;
const pt=(()=>{try{const a=firebase.initializeApp(PT_CONFIG,'pt');return {a:a.auth(),db:a.firestore()}}catch(e){return null}})();
function ptStart(u){
  if(ptUnsub){ptUnsub.forEach(f=>f());ptUnsub=null}
  if(!u){P.state='out';P.entries=[];P.set=null;render();return}
  P.state='in';P.user=u;P.err='';render();
  const base=pt.db.collection('users').doc(u.uid);
  ptUnsub=[base.collection('entries').onSnapshot(s=>{P.entries=s.docs.map(d=>d.data());render()},()=>{}),
    base.collection('meta').doc('settings').onSnapshot(d=>{P.set=d.exists?d.data():null;render()},()=>{})];
}
if(pt)pt.a.onAuthStateChanged(u=>ptStart(u));else P.state='out';
function cacheSave(){try{ls.set('sam_cache',JSON.stringify({items:S.items,days:S.days,exp:S.exp}))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(ls.get('sam_cache')||'null');if(c){S.items=c.items||{};S.days=c.days||{};S.exp=c.exp||{}}}catch(e){}}
async function start(u){
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){S.mode='login';S.items={};S.days={};S.exp={};ls.del('sam_cache');ls.del('sam_shop');render();return}
  S.user=String(u.email||'').replace(USER_DOMAIN,'');cacheLoad();
  let shop=ls.get('sam_shop')||null;
  try{const d=await auth.db.collection('users').doc(u.uid).get();shop=(d.exists&&d.data().shop)||u.uid}catch(e){S.offline=true;shop=shop||u.uid}
  if(shop!==u.uid){let owners=[];try{const sd=await auth.db.collection('shops').doc(shop).get();owners=(sd.exists&&sd.data().owners)||[]}catch(e){}
    if(owners.indexOf(u.uid)<0&&!S.offline){S.mode='notOwner';render();return}}
  ls.set('sam_shop',shop);S.mode='home';render();if(ls.get('sam_hr'))hrLoad();
  if(S.locked)unlock();
  const base=auth.db.collection('shops').doc(shop),err=()=>{S.offline=true;render()},ok=s=>{S.offline=!!(s.metadata&&s.metadata.fromCache&&!navigator.onLine)};
  const back=new Date();back.setDate(back.getDate()-45);
  unsubs=[
    base.collection('hl_items').onSnapshot(s=>{const o={};s.forEach(d=>{o[d.id]=d.data()});S.items=o;ok(s);cacheSave();render()},err),
    base.collection('hl_days').orderBy('d','desc').limit(45).onSnapshot(s=>{const o={};s.forEach(d=>{o[d.id]=d.data()});S.days=o;ok(s);cacheSave();render()},err),
    base.collection('hl_exp').orderBy('d','desc').limit(500).onSnapshot(s=>{const o={};s.forEach(d=>{const x=d.data();if(x.d>=dkey(back))o[d.id]=x});S.exp=o;ok(s);cacheSave();render()},err)];
}

// ---- events ----
const ACT={
  lang(){S.lang=S.lang==='en'?'lo':'en';ls.set('sam_lang',S.lang);render()},
  unlock(){unlock()},
  signout(){ls.del('sam_lock');ls.del('sam_hr');H.state='out';H.data=null;S.locked=false;if(pt)pt.a.signOut();if(auth)auth.a.signOut()},
  ptOut(){if(pt)pt.a.signOut()},
  hrLoad(){hrLoad()},
  hrOut(){ls.del('sam_hr');H.state='out';H.data=null;render()},
  ptGoogle(){if(!pt)return;pt.a.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e&&e.code!=='auth/popup-closed-by-user'){P.err=t('ptErr');render()}})},
  lockTog(){if(ls.get('sam_lock')){ls.del('sam_lock');toast(t('lockOff'));render()}else lockOn()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act]()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='hrf'){e.preventDefault();const v=$('#hp').value.trim();if(v)hrLoad(v);return}
  if(e.target.id==='ptf'){e.preventDefault();const em=$('#pe').value.trim(),pw=$('#pp').value;if(!em||!pw)return;P.err='';
    pt.a.signInWithEmailAndPassword(em,pw).catch(x=>{P.err=t(x&&x.code==='auth/network-request-failed'?'netErr':'ptErr');render()});return}
  if(e.target.id!=='lf')return;e.preventDefault();
  const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return;
  S.err='';const em=u.indexOf('@')>=0?u:u.toLowerCase()+USER_DOMAIN;
  auth.a.signInWithEmailAndPassword(em,p).catch(x=>{S.err=t(x&&x.code==='auth/network-request-failed'?'netErr':'wrong');render()});
});
setInterval(()=>{if(S.mode==='home'&&!S.locked)render()},60000);
if(!auth){S.mode='login';S.err=t('netErr');render()}else{render();auth.a.onAuthStateChanged(u=>start(u))}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
